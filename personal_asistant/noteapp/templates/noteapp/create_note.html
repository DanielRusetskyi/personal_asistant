{% extends "base.html" %}

{% block content %}
<form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
  {% csrf_token %}
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8 bg-white p-4 rounded shadow">
        <h3 class="text-center mb-4">📝 Створення нового завдання</h3>

        <!-- Назва завдання -->
        <div class="mb-3">
          <label for="title" class="form-label">Назва завдання *</label>
          <input type="text" class="form-control" id="title" name="title" placeholder="Наприклад, Зателефонувати лікарю" required>
          <div class="invalid-feedback">Будь ласка, вкажіть назву завдання.</div>
        </div>

        <!-- Опис -->
        <div class="mb-3">
          <label for="description" class="form-label">Опис</label>
          <textarea class="form-control" id="description" name="description" rows="3" placeholder="Додаткові деталі..."></textarea>
        </div>

        <!-- Дата і час -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="due_date" class="form-label">Дата</label>
            <input type="date" class="form-control" id="due_date" name="due_date">
          </div>
          <div class="col-md-6">
            <label for="due_time" class="form-label">Час</label>
            <input type="time" class="form-control" id="due_time" name="due_time">
          </div>
        </div>

        <!-- Пріоритет -->
        <div class="mb-3">
          <label for="priority" class="form-label">Пріоритет</label>
          <select class="form-select" id="priority" name="priority">
            <option value="high">🔴 Високий</option>
            <option value="medium">🟡 Середній</option>
            <option value="low">⚪ Низький</option>
          </select>
        </div>

        <!-- Категорія -->
        <div class="mb-3">
          <label for="category" class="form-label">Категорія</label>
          <select class="form-select" id="category" name="category">
            <option value="work">Робота</option>
            <option value="personal">Особисте</option>
            <option value="shopping">Покупки</option>
            <option value="meeting">Зустріч</option>
          </select>
        </div>

        <!-- Нагадування -->
        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="reminderSwitch" name="reminder">
          <label class="form-check-label" for="reminderSwitch">Нагадати перед подією</label>
        </div>

        <!-- Вкладення -->
        <div class="mb-3">
          <label for="attachment" class="form-label">Вкладення (опціонально)</label>
          <input class="form-control" type="file" id="attachment" name="attachment">
        </div>

        <!-- Кнопка -->
        <div class="text-center">
          <button type="submit" class="btn btn-primary px-5">💾 Зберегти завдання</button>
        </div>

      </div>
    </div>
  </div>
</form>

<!-- Валідація Bootstrap -->
<script>
  (() => {
    'use strict';
    const forms = document.querySelectorAll('.needs-validation');
    Array.from(forms).forEach(form => {
      form.addEventListener('submit', event => {
        if (!form.checkValidity()) {
          event.preventDefault();
          event.stopPropagation();
        }
        form.classList.add('was-validated');
      }, false);
    });
  })();
</script>
{% endblock %}
