{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center min-h-full flex-col w-full mt-10">

    <section id="appearance">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title mb-1">Вигляд</h5>
          <p class="text-muted">Теми, компактність інтерфейсу та інші візуальні налаштування.</p>

          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label class="form-label">Тема</label>
              <select class="form-select" id="theme-select" disabled>
                <option value="auto" selected>Авто</option>
                <option value="light">Світла</option>
                <option value="dark">Темна</option>
              </select>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-check form-switch mt-4">
                <input class="form-check-input" type="checkbox" id="compact-ui" disabled>
                <label class="form-check-label" for="compact-ui">Компактний режим <span class="text-muted">(скоро)</span></label>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>
<!--    <a href="{% url 'main' %}" class="button_weather inline-block mt-1 text-center">⬅ Назад</a>-->
</div>
{% endblock %}
