{% extends "base.html" %}
{% load static %}

{% block title %}Інтернет-радіо{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto p-4">
  <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-white/50 to-slate-50/25 backdrop-blur shadow-xl ring-1 ring-slate-900/10">
    <div class="p-5 space-y-4">
      <div class="mb-2 text-center uppercase tracking-wide text-slate-700 dark:text-slate-100
            text-xl md:text-2xl font-bold drop-shadow-sm">
        Інтернет-радіо
      </div>
      <!-- Заголовок -->
      <div class="flex items-center gap-3">
        <img id="logo" src="" alt="logo" class="w-12 h-12 rounded-xl object-cover bg-slate-200 hidden" />
        <div class="min-w-0">

          <div id="now-title" class="text-lg font-semibold truncate">Обрати станцію…</div>
          <div id="now-sub" class="text-xs text-slate-500 truncate"></div>
        </div>
      </div>

      <!-- Станція + кнопки -->
      <div class="grid sm:grid-cols-5 gap-3 items-center">
        <label class="sm:col-span-3 w-full">
          <span class="sr-only">Станція</span>
          <select id="station" class="w-full rounded-xl border px-3 py-2 bg-white/80 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="">Обрати станцію…</option>
          </select>
        </label>
        <div class="sm:col-span-2 flex items-center justify-end gap-2">
          <button id="btn-play" class="px-3 py-2 rounded-xl bg-blue-600 text-white hover:bg-blue-700" title="Play/Pause">
            <i class="bi bi-play-fill"></i>
          </button>
          <button id="btn-stop" class="px-3 py-2 rounded-xl bg-slate-200 hover:bg-slate-300" title="Stop">
            <i class="bi bi-stop-fill"></i>
          </button>
          <button id="btn-mute" class="px-3 py-2 rounded-xl bg-slate-200 hover:bg-slate-300" title="Mute">
            <i class="bi bi-volume-up"></i>
          </button>
        </div>
      </div>

      <!-- Гучність + статус -->
      <div class="flex items-center gap-3">
        <input id="volume" type="range" min="0" max="1" step="0.01" value="1" class="flex-1" />
        <span id="status" class="text-xs text-slate-200">—</span>
      </div>

      <!-- Візуалізація -->
      <canvas id="viz" class="w-full h-16 rounded-xl bg-slate-100"></canvas>

      <!-- Підказки -->
      <p id="hotkeys-hint" class="text-xs text-slate-500 hidden md:block">
        Клавіші: <kbd>Space</kbd> — Play/Pause, <kbd>S</kbd> — Stop, <kbd>M</kbd> — Mute, <kbd>↑/↓</kbd> — гучність.
      </p>
<!--      <p class="text-xs text-slate-100">-->
<!--        Клавіші: <kbd>Space</kbd> — Play/Pause, <kbd>S</kbd> — Stop, <kbd>M</kbd> — Mute, <kbd>↑/↓</kbd> — гучність.-->
<!--      </p>-->

      <audio id="audio" preload="none" crossorigin="anonymous" class="hidden"></audio>
    </div>
  </div>
</div>

<!-- Конфіг у JSON для статичного JS -->
<script id="radio-config" type="application/json">
{
  "useProxy": {{ use_proxy|yesno:"true,false" }},
  "stationsUrl": "{% url 'additional:stations' %}"
}
</script>
<!-- Підключення компакт-скрипта -->
<script type="module" src="{% static 'additional/radio_compact.js' %}"></script>
{% endblock %}
