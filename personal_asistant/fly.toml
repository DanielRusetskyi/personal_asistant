# fly.toml app configuration file generated for personal-asistant on 2025-08-01T13:49:16+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'personal-asistant'
primary_region = 'waw'
console_command = '/code/manage.py shell'

[build]

[deploy]
release_command = 'sh -c "python manage.py migrate --noinput"'

[env]
PORT = '8000'
DJANGO_SETTINGS_MODULE = "personal_asistant.settings"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
