{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container py-3">
  <h4 class="mb-3">{% trans "Create group" %}</h4>
  <form method="post" class="card p-3 shadow-sm">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">{% trans "Title" %}</label>
      <input type="text" name="title" class="form-control" placeholder="{% trans 'My group' %}">
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" name="is_public" id="is_public">
      <label class="form-check-label" for="is_public">{% trans "Public" %}</label>
    </div>
    <button class="btn btn-primary" type="submit">{% trans "Create" %}</button>
  </form>
</div>
{% endblock %}
