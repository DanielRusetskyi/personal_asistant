{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">{% trans "Groups" %}</h4>
    <a class="btn btn-primary" href="{% url 'chat:group_create' %}">{% trans "Create group" %}</a>
  </div>

  <ul class="list-group">
    {% for t in threads %}
      <li class="list-group-item d-flex justify-content-between">
        <a href="{% url 'chat:group_thread' t.id %}">{{ t.title|default:_("Group") }}</a>
        {% if t.is_public %}<span class="badge text-bg-success">public</span>{% endif %}
      </li>
    {% empty %}
      <li class="list-group-item text-muted">{% trans "No groups yet" %}</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
