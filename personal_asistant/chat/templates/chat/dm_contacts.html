{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container py-3">
  <h3 class="mb-3">{% trans "Direct messages" %}</h3>
  <ul class="list-group">
    {% for u in users %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        <span>{{ u.username }}</span>
        <a class="btn btn-sm btn-primary" href="{% url 'chat:dm_start' u.id %}">
          {% trans "Message" %}
        </a>
      </li>
    {% empty %}
      <li class="list-group-item text-muted">{% trans "No users found" %}</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
