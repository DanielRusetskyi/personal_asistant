{% extends "base.html" %}
{% load i18n %}
{% block content %}
<div class="container py-3">
  <h4 class="mb-3">Lobby</h4>
  <ul class="list-group">
    {% for t in lobbies %}
      <li class="list-group-item d-flex justify-content-between">
        <a href="{% url 'chat:lobby_room' t.slug %}">{{ t.title }} </a>
        <span class="text-muted">#{{ t.slug }}</span>
      </li>
    {% empty %}
      <li class="list-group-item text-muted">{% trans "No lobbies yet" %}</li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
