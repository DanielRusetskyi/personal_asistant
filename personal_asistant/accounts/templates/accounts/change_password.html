{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="container mt-5 animate-drop-bounce">
  <div class="row justify-content-center">
    <div class="col-md-6 bg-light p-4 rounded shadow-lg animate__animated animate__fadeIn">
      <h3 class="text-center text-primary mb-4">
        <i class="bi bi-shield-lock-fill"></i> Зміна пароля
      </h3>

      <form method="post" novalidate>
        {% csrf_token %}

        <div class="form-group mb-3 position-relative">
          <label for="{{ form.old_password.id_for_label }}"><i class="bi bi-key"></i> Старий пароль</label>
          {{ form.old_password }}
          {{ form.old_password.errors }}
        </div>

        <div class="form-group mb-3 position-relative">
          <label for="{{ form.new_password1.id_for_label }}"><i class="bi bi-lock-fill"></i> Новий пароль</label>
          {{ form.new_password1 }}
          <div id="password-strength" class="form-text mt-1"></div>
          {{ form.new_password1.errors }}
        </div>

        <div class="form-group mb-3 position-relative">
          <label for="{{ form.new_password2.id_for_label }}"><i class="bi bi-lock"></i> Підтвердіть пароль</label>
          {{ form.new_password2 }}
          {{ form.new_password2.errors }}
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary px-4 shadow">
            <i class="bi bi-check-circle"></i> Зберегти
          </button>
          <a href="{% url 'accounts:profile' %}" class="btn btn-outline-secondary ms-2">
            <i class="bi bi-arrow-left"></i> Назад
          </a>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Password Strength Checker -->
<script>
  const passwordInput = document.getElementById("id_new_password1");
  const strengthText = document.getElementById("password-strength");

  passwordInput?.addEventListener("input", () => {
    const val = passwordInput.value;
    let strength = 0;

    if (val.length >= 8) strength += 1;
    if (/[A-Z]/.test(val)) strength += 1;
    if (/[0-9]/.test(val)) strength += 1;
    if (/[^A-Za-z0-9]/.test(val)) strength += 1;

    let msg = "";
    let color = "";

    switch (strength) {
      case 0:
      case 1:
        msg = "Слабкий пароль 😟";
        color = "red";
        break;
      case 2:
        msg = "Середній пароль 🙂";
        color = "orange";
        break;
      case 3:
        msg = "Добрий пароль 😊";
        color = "blue";
        break;
      case 4:
        msg = "Сильний пароль 💪";
        color = "green";
        break;
    }

    strengthText.textContent = msg;
    strengthText.style.color = color;
  });
</script>

{% endblock %}
