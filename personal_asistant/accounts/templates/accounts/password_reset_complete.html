{% extends 'base.html' %}

{% load i18n %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center bg-white rounded shadow-sm p-5 border">
      <h2 class="text-dark mb-4">{% trans 'Password reset complete' %}</h2>
      <p class="text-muted mb-4">{% trans 'Your new password has been set. You can log in now.' %}</p>
      <a href="{% url 'accounts:login' %}" class="btn btn-secondary px-4 py-2">
        {% trans 'Log in' %}
      </a>
    </div>
  </div>
</div>
{% endblock %}
