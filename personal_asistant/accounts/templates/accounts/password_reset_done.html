{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
  body {
    background: linear-gradient(to right, #f8f9fa, #e9ecef);
  }
</style>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="bg-white p-5 rounded shadow border border-1">
        <h2 class="text-center text-primary mb-4">📧 Запит на зміну пароля надіслано</h2>
        <p class="text-center text-dark">
          Ми щойно відправили інструкції для зміни пароля на вашу електронну адресу. Якщо листа немає у папці «Вхідні», перевірте «Спам».
        </p>
        <div class="text-center mt-4">
          <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary px-4">
            Повернутися до входу
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
