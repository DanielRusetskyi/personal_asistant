{% extends 'base.html' %}

{% load i18n %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow text-center animate__animated animate__fadeIn">
      <h3 class="text-success mb-3">
        <i class="bi bi-check-circle-fill"></i> {% trans 'Password changed successfully' %}
      </h3>
      <p class="text-muted">
        {% trans 'Your new password has been saved. You can continue working with your account.' %}
      </p>

      <a href="{% url 'accounts:profile' %}" class="btn btn-primary mt-3">
        <i class="bi bi-person-circle"></i> {% trans 'Back to profile' %}
      </a>
    </div>
  </div>
</div>
{% endblock %}
