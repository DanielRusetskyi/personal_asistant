{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 bg-white p-4 rounded shadow text-center animate__animated animate__fadeIn">
      <h3 class="text-success mb-3">
        <i class="bi bi-check-circle-fill"></i> Пароль змінено успішно
      </h3>
      <p class="text-muted">
        Ваш новий пароль збережено. Ви можете продовжити роботу з вашим обліковим записом.
      </p>

      <a href="{% url 'accounts:profile' %}" class="btn btn-primary mt-3">
        <i class="bi bi-person-circle"></i> До профілю
      </a>
    </div>
  </div>
</div>
{% endblock %}
